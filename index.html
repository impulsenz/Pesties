<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pestis - Enterprise Field Operations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            400: '#fb923c',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                            900: '#7c2d12',
                            950: '#431407'
                        }
                    }
                }
            }
        }
    </script>
    <script>
        try { if (localStorage.getItem('pestis-theme') === 'light') document.documentElement.classList.remove('dark'); } catch (e) {}
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --bg: #f3f5fa;
            --surface: #ffffff;
            --surface2: #f4f6fb;
            --surface3: #e7ebf5;
            --field: #ffffff;
            --border: #d8deeb;
            --text: #0b1530;
            --muted: #4b5a78;
            --faint: #7b88a3;
            --accent: #f97316;
            --accent-text: #c2410c;
            --header-bg: rgba(255, 255, 255, .88);
            --shadow: 0 10px 30px -14px rgba(15, 23, 42, .22);
            --overlay: rgba(15, 23, 42, .55);
        }
        html.dark {
            --bg: #060d1f;
            --surface: #0c1733;
            --surface2: #091229;
            --surface3: #16244a;
            --field: #0f1c3d;
            --border: #1d2d58;
            --text: #f1f5f9;
            --muted: #9db0d1;
            --faint: #6b7fa6;
            --accent: #fb923c;
            --accent-text: #fb923c;
            --header-bg: rgba(9, 18, 42, .85);
            --shadow: 0 20px 40px -22px rgba(0, 0, 0, .75);
            --overlay: rgba(3, 8, 22, .82);
        }

        body { background: var(--bg); color: var(--text); }
        ::selection { background: #f97316; color: #fff; }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 1.1rem; box-shadow: var(--shadow); }
        .inset { background: var(--surface2); border: 1px solid var(--border); border-radius: .85rem; }
        .app-header { background: var(--header-bg); border-bottom: 1px solid var(--border); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .divider { border-color: var(--border); }
        .overlay { background: var(--overlay); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
        .logo-tile { background: #000; border-radius: .8rem; padding: 3px; border: 1px solid var(--border); display: inline-flex; }

        .t-strong { color: var(--text); }
        .t-muted { color: var(--muted); }
        .t-faint { color: var(--faint); }
        .t-accent { color: var(--accent-text); }
        .lbl { display: block; font-size: .75rem; font-weight: 500; color: var(--muted); margin-bottom: .25rem; }
        .eyebrow { font-size: .62rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }

        .field { width: 100%; background: var(--field); border: 1px solid var(--border); color: var(--text); border-radius: .75rem; padding: .7rem .85rem; font-size: .875rem; outline: none; transition: border-color .15s, box-shadow .15s; }
        .field::placeholder { color: var(--faint); }
        .field:focus { border-color: #f97316; box-shadow: 0 0 0 3px rgba(249, 115, 22, .18); }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; font-weight: 800; font-size: .75rem; padding: .7rem 1.1rem; border-radius: .8rem; cursor: pointer; transition: all .15s ease; border: 1px solid transparent; white-space: nowrap; }
        .btn:hover { filter: brightness(1.08); }
        .btn:active { transform: scale(.98); }
        .btn-primary { background: linear-gradient(90deg, #ea580c, #f97316); color: #fff; box-shadow: 0 8px 20px -10px rgba(249, 115, 22, .8); }
        .btn-secondary { background: var(--surface3); color: var(--text); border-color: var(--border); }
        .btn-blue { background: #1d4ed8; color: #fff; }
        .btn-danger { background: #dc2626; color: #fff; }
        .btn-outline-danger { background: transparent; color: #dc2626; border-color: #dc2626; }
        html.dark .btn-outline-danger { color: #f87171; border-color: #f87171; }
        .btn-outline-danger:hover { background: rgba(220, 38, 38, .1); }
        .btn-white { background: #fff; color: #0f172a; border-color: #d8deeb; }
        .icon-btn { width: 2.5rem; height: 2.5rem; display: inline-flex; align-items: center; justify-content: center; border-radius: .8rem; background: var(--surface3); border: 1px solid var(--border); color: var(--text); cursor: pointer; transition: all .15s; }
        .icon-btn:hover { border-color: #f97316; color: var(--accent-text); }
        .icon-sun { display: none; }
        html.dark .icon-sun { display: inline; }
        html.dark .icon-moon { display: none; }

        .chip { display: inline-flex; align-items: center; gap: .35rem; padding: .22rem .65rem; border-radius: .65rem; font-size: .7rem; font-weight: 700; border: 1px solid; white-space: nowrap; }
        .chip-amber { color: #b45309; background: #fef3c7; border-color: #fcd34d; }
        .chip-green { color: #047857; background: #d1fae5; border-color: #6ee7b7; }
        .chip-blue { color: #1d4ed8; background: #dbeafe; border-color: #93c5fd; }
        .chip-red { color: #b91c1c; background: #fee2e2; border-color: #fca5a5; }
        .chip-orange { color: #c2410c; background: #ffedd5; border-color: #fdba74; }
        html.dark .chip-amber { color: #fbbf24; background: rgba(245, 158, 11, .12); border-color: rgba(245, 158, 11, .3); }
        html.dark .chip-green { color: #34d399; background: rgba(16, 185, 129, .12); border-color: rgba(16, 185, 129, .3); }
        html.dark .chip-blue { color: #7db4ff; background: rgba(59, 130, 246, .14); border-color: rgba(59, 130, 246, .35); }
        html.dark .chip-red { color: #f87171; background: rgba(239, 68, 68, .12); border-color: rgba(239, 68, 68, .3); }
        html.dark .chip-orange { color: #fb923c; background: rgba(249, 115, 22, .14); border-color: rgba(249, 115, 22, .35); }

        .row-item { background: var(--surface2); border: 1px solid var(--border); border-radius: .8rem; transition: border-color .15s, background .15s; }
        .row-item.clickable { cursor: pointer; }
        .row-item.clickable:hover { border-color: #f97316; background: var(--surface3); }
        .link-btn { color: var(--accent-text); font-weight: 700; text-decoration: underline; cursor: pointer; font-size: .75rem; }

        .site-card { position: relative; display: block; width: 100%; aspect-ratio: 4 / 3; border-radius: 1rem; overflow: hidden; text-align: left; cursor: pointer; border: 1px solid rgba(255, 255, 255, .08); transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; box-shadow: var(--shadow); }
        .site-card:hover, .site-card:focus-visible { transform: translateY(-4px) scale(1.03); box-shadow: 0 18px 40px -14px rgba(249, 115, 22, .6); border-color: #fb923c; outline: none; }
        .site-initials { position: absolute; right: .8rem; top: .2rem; font-size: 4.5rem; font-weight: 900; color: rgba(255, 255, 255, .15); line-height: 1; pointer-events: none; }
        .site-overlay { position: absolute; left: 0; right: 0; bottom: 0; padding: 2.6rem .95rem .85rem; background: linear-gradient(to top, rgba(2, 6, 23, .94), rgba(2, 6, 23, 0)); display: flex; flex-direction: column; gap: .12rem; }
        .site-name { color: #fff; font-weight: 800; font-size: .95rem; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .site-addr { color: rgba(255, 255, 255, .78); font-size: .72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .site-open { position: absolute; top: .7rem; left: .7rem; font-size: .65rem; font-weight: 800; color: #fff; background: #f97316; padding: .22rem .6rem; border-radius: .5rem; opacity: 0; transform: translateY(-4px); transition: all .2s ease; }
        .site-card:hover .site-open, .site-card:focus-visible .site-open { opacity: 1; transform: none; }
        .site-card-add { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .5rem; aspect-ratio: 4 / 3; width: 100%; border-radius: 1rem; border: 2px dashed var(--border); color: var(--muted); font-weight: 800; font-size: .8rem; cursor: pointer; transition: all .2s ease; background: transparent; }
        .site-card-add:hover { border-color: #f97316; color: var(--accent-text); transform: translateY(-3px); }

        .ph-hidden { display: none !important; }
        .scroll-thin { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    </style>
</head>
