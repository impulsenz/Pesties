<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pestis - Enterprise Field Operations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            400: '#fb923c',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                            900: '#7c2d12',
                            950: '#431407'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Apply saved theme before first paint (dark is the default) -->
    <script>
        try { if (localStorage.getItem('pestis-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Html5Qrcode Scanner Library (pinned version so it can be cached for offline use) -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
    <!-- jsPDF for Professional Client PDF Service Reports -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        /* ================= THEME TOKENS ================= */
        :root {
            --bg: #f3f5fa;
            --surface: #ffffff;
            --surface2: #f4f6fb;
            --surface3: #e7ebf5;
            --field: #ffffff;
            --border: #d8deeb;
            --text: #0b1530;
            --muted: #4b5a78;
            --faint: #7b88a3;
            --accent: #f97316;
            --accent-text: #c2410c;
            --header-bg: rgba(255, 255, 255, .88);
            --shadow: 0 10px 30px -14px rgba(15, 23, 42, .22);
            --overlay: rgba(15, 23, 42, .55);
        }
        html.dark {
            --bg: #060d1f;
            --surface: #0c1733;
            --surface2: #091229;
            --surface3: #16244a;
            --field: #0f1c3d;
            --border: #1d2d58;
            --text: #f1f5f9;
            --muted: #9db0d1;
            --faint: #6b7fa6;
            --accent: #fb923c;
            --accent-text: #fb923c;
            --header-bg: rgba(9, 18, 42, .85);
            --shadow: 0 20px 40px -22px rgba(0, 0, 0, .75);
            --overlay: rgba(3, 8, 22, .82);
        }

        body { background: var(--bg); color: var(--text); }
        ::selection { background: #f97316; color: #fff; }

        /* ================= SURFACES ================= */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 1.1rem; box-shadow: var(--shadow); }
        .inset { background: var(--surface2); border: 1px solid var(--border); border-radius: .85rem; }
        .app-header { background: var(--header-bg); border-bottom: 1px solid var(--border); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .divider { border-color: var(--border); }
        .overlay { background: var(--overlay); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
        .logo-tile { background: #000; border-radius: .8rem; padding: 3px; border: 1px solid var(--border); display: inline-flex; }

        /* ================= TEXT ================= */
        .t-strong { color: var(--text); }
        .t-muted { color: var(--muted); }
        .t-faint { color: var(--faint); }
        .t-accent { color: var(--accent-text); }
        .lbl { display: block; font-size: .75rem; font-weight: 500; color: var(--muted); margin-bottom: .25rem; }
        .eyebrow { font-size: .62rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }

        /* ================= FORM FIELDS ================= */
        .field { width: 100%; background: var(--field); border: 1px solid var(--border); color: var(--text); border-radius: .75rem; padding: .7rem .85rem; font-size: .875rem; outline: none; transition: border-color .15s, box-shadow .15s; }
        .field::placeholder { color: var(--faint); }
        .field:focus { border-color: #f97316; box-shadow: 0 0 0 3px rgba(249, 115, 22, .18); }
        html.dark input[type="date"].field { color-scheme: dark; }

        /* ================= BUTTONS ================= */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; font-weight: 800; font-size: .75rem; padding: .7rem 1.1rem; border-radius: .8rem; cursor: pointer; transition: all .15s ease; border: 1px solid transparent; white-space: nowrap; }
        .btn:hover { filter: brightness(1.08); }
        .btn:active { transform: scale(.98); }
        .btn:disabled { opacity: .55; cursor: not-allowed; }
        .btn-primary { background: linear-gradient(90deg, #ea580c, #f97316); color: #fff; box-shadow: 0 8px 20px -10px rgba(249, 115, 22, .8); }
        .btn-secondary { background: var(--surface3); color: var(--text); border-color: var(--border); }
        .btn-blue { background: #1d4ed8; color: #fff; }
        .btn-danger { background: #dc2626; color: #fff; }
        .btn-outline-danger { background: transparent; color: #dc2626; border-color: #dc2626; }
        html.dark .btn-outline-danger { color: #f87171; border-color: #f87171; }
        .btn-outline-danger:hover { background: rgba(220, 38, 38, .1); }
        .btn-white { background: #fff; color: #0f172a; border-color: #d8deeb; }
        .icon-btn { width: 2.5rem; height: 2.5rem; display: inline-flex; align-items: center; justify-content: center; border-radius: .8rem; background: var(--surface3); border: 1px solid var(--border); color: var(--text); cursor: pointer; transition: all .15s; }
        .icon-btn:hover { border-color: #f97316; color: var(--accent-text); }
        .icon-sun { display: none; }
        html.dark .icon-sun { display: inline; }
        html.dark .icon-moon { display: none; }

        /* ================= CHIPS ================= */
        .chip { display: inline-flex; align-items: center; gap: .35rem; padding: .22rem .65rem; border-radius: .65rem; font-size: .7rem; font-weight: 700; border: 1px solid; white-space: nowrap; }
        .chip-amber { color: #b45309; background: #fef3c7; border-color: #fcd34d; }
        .chip-green { color: #047857; background: #d1fae5; border-color: #6ee7b7; }
        .chip-blue { color: #1d4ed8; background: #dbeafe; border-color: #93c5fd; }
        .chip-red { color: #b91c1c; background: #fee2e2; border-color: #fca5a5; }
        .chip-orange { color: #c2410c; background: #ffedd5; border-color: #fdba74; }
        html.dark .chip-amber { color: #fbbf24; background: rgba(245, 158, 11, .12); border-color: rgba(245, 158, 11, .3); }
        html.dark .chip-green { color: #34d399; background: rgba(16, 185, 129, .12); border-color: rgba(16, 185, 129, .3); }
        html.dark .chip-blue { color: #7db4ff; background: rgba(59, 130, 246, .14); border-color: rgba(59, 130, 246, .35); }
        html.dark .chip-red { color: #f87171; background: rgba(239, 68, 68, .12); border-color: rgba(239, 68, 68, .3); }
        html.dark .chip-orange { color: #fb923c; background: rgba(249, 115, 22, .14); border-color: rgba(249, 115, 22, .35); }

        .sync-btn { cursor: pointer; padding: 0 .85rem; }
        .visit-act { width: 100%; justify-content: center; text-align: center; line-height: 1.2; padding-left: .5rem; padding-right: .5rem; white-space: normal; }
        .header-h { height: 2.5rem; border-radius: .8rem; box-sizing: border-box; }
        @media (max-width: 639px) {
            #appHeader .icon-btn, #appHeader .header-h { width: 2.2rem; height: 2.2rem; min-width: 2.2rem; }
            #appHeader #syncStatusBadge { width: auto; padding: 0 .55rem; }
            #appHeader button.header-h:last-child { width: auto; }
            #appHeader #adminBtn, #appHeader #themeBtnHeader { display: none !important; }
            #appHeader .logo-tile img { height: 2.4rem; }
        }
        .sync-btn:hover { filter: brightness(1.05); }
        .station-photo-box { width: 5.5rem; height: 5.5rem; border-radius: .8rem; overflow: hidden; background: var(--surface3); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0; }
        .station-photo-box img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
        .station-photo-lg { width: 8rem; height: 8rem; }
        .station-photo-empty { font-size: .65rem; text-align: center; color: var(--faint); line-height: 1.3; }
        .station-photo-new { position: absolute; bottom: .25rem; right: .25rem; background: #f97316; color: #fff; font-size: .55rem; font-weight: 900; padding: .05rem .35rem; border-radius: 999px; }
        .site-hero-band { position: relative; isolation: isolate; padding: 1rem; background: linear-gradient(135deg, rgba(249, 115, 22, .10), transparent 55%); }
        .sh-topline { display: flex; align-items: center; justify-content: space-between; gap: .75rem; font-size: 11px; margin-bottom: .8rem; }
        .sh-id { display: flex; align-items: flex-start; gap: .9rem; min-width: 0; }
        .sh-id > .min-w-0 { min-width: 0; flex: 1; }
        .sh-title { font-size: 1.45rem; font-weight: 900; line-height: 1.15; }
        .sh-contact { margin-top: .75rem; }
        .sh-body { padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
        @media (min-width: 640px) {
            .site-hero-band { padding: 1.5rem 1.75rem; }
            .sh-id { gap: 1.25rem; }
            .sh-title { font-size: 2rem; }
            .sh-body { padding: 1.25rem 1.75rem 1.75rem; }
        }
        .site-hero-band::before { content: ''; position: absolute; inset: 0; z-index: -1; background-image: var(--hero-img, none); background-size: cover; background-position: center; filter: blur(30px) saturate(1.25); opacity: .16; transform: scale(1.25); }
        .sh-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; align-items: start; }
        @media (min-width: 1024px) { .sh-grid { grid-template-columns: minmax(0, 1fr) 15.5rem; gap: 1.75rem; align-items: center; } }
        .sh-cover { flex-shrink: 0; width: 7rem; height: 7rem; border-radius: 1rem; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 8px 22px rgba(0, 0, 0, .16); }
        @media (min-width: 640px) { .sh-cover { width: 10.5rem; height: 10.5rem; border-radius: 1.25rem; } }
        @media (min-width: 1280px) { .sh-cover { width: 13rem; height: 13rem; border-radius: 1.4rem; } }
        .sh-sync { display: flex; align-items: center; gap: .5rem; min-width: 0; margin-top: .35rem; font-size: 11px; color: var(--faint); }
        .sh-info { display: grid; gap: .75rem; grid-template-columns: minmax(0, 1fr); }
        .sh-pair { padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
        .sh-pair-2 { border-top: 1px solid var(--border); padding-top: 1rem; }
        @media (min-width: 768px) { .sh-info { gap: 1rem; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .sh-loc { grid-column: 1 / -1; } }
        @media (min-width: 1280px) { .sh-info { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 2fr); } .sh-loc { grid-column: auto; } }
        .svc-mini-list { display: flex; flex-direction: column; gap: .35rem; max-height: 9.4rem; overflow-y: auto; }
        .svc-mini { display: flex; align-items: center; gap: .5rem; width: 100%; text-align: left; padding: .4rem .55rem; border-radius: .6rem; background: var(--surface); border: 1px solid var(--border); font-size: .75rem; cursor: pointer; min-width: 0; }
        .svc-mini:hover { border-color: #10b981; }
        .svc-mini .chip { font-size: 9.5px; padding: .05rem .4rem; }
        .kpi-click { cursor: pointer; transition: border-color .15s, transform .15s; }
        .kpi-click:hover { border-color: #f97316; }
        .kpi-click:active { transform: scale(.98); }
        .kpi-click .kpi-k::after { content: ' ›'; opacity: .6; }
        .land-board { display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: flex-start; }
        .land-board > .land-card { flex: 0 0 auto; width: 100%; }
        @media (min-width: 1024px) { .land-board > .land-card { width: calc((100% + 1.5rem) * var(--lc-f, .3333) - 1.5rem); } }
        .land-card { position: relative; display: flex; flex-direction: column; min-width: 0; height: var(--lc-h, 40rem); padding: 1.25rem 1.25rem 1rem; container-type: inline-size; }
        @container (max-width: 380px) {
            .lc-bar { gap: .35rem; }
            .lc-bar .eyebrow { font-size: .58rem; letter-spacing: .1em; }
            .land-card .tab-btn { padding: .3rem .5rem; font-size: .66rem; }
            .land-card select.field, .land-card input.field { font-size: .7rem !important; }
            #sightFilters select { flex: 1 1 calc(50% - .4rem); max-width: none !important; width: auto !important; }
            #siteStationSearch { width: 100% !important; flex: 1 1 100%; }
            .land-card .rec-mini-legend { display: none; }
            .land-card .nf-grid { grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr)); gap: .5rem; }
        }
        @container (max-width: 260px) {
            .land-card .nf-grid { grid-template-columns: minmax(0, 1fr); }
            #sightFilters select { flex: 1 1 100%; }
            .land-card .lc-bar > span, .land-card .lc-bar > div:not(#recAgeChart) { flex-wrap: wrap; }
        }
        @container (min-width: 700px) { .land-card .nf-grid { grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); } }
        @media (max-width: 1023px) { .land-card { height: var(--lc-hm, 34rem); padding: 1rem 1rem .85rem; } }
        .lc-head { flex-shrink: 0; display: flex; flex-direction: column; gap: .6rem; padding-bottom: .75rem; margin-bottom: .75rem; border-bottom: 1px solid var(--border); }
        .lc-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem; min-height: 2rem; }
        .lc-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-right: .3rem; }
        .lc-move { display: inline-flex; align-items: center; justify-content: center; width: 1.6rem; height: 1.6rem; margin-left: -.35rem; border-radius: .45rem; color: var(--faint); font-size: 1rem; line-height: 1; cursor: grab; touch-action: none; user-select: none; flex-shrink: 0; }
        .lc-move:hover, .lc-move:focus-visible { background: var(--surface2); color: var(--text); outline: none; }
        .lc-resize { position: absolute; right: 3px; bottom: 3px; width: 18px; height: 18px; cursor: nwse-resize; touch-action: none; border-radius: 0 0 .7rem 0; opacity: .55;
            background: linear-gradient(135deg, transparent 0 55%, var(--faint) 55% 61%, transparent 61% 72%, var(--faint) 72% 78%, transparent 78%); }
        .lc-resize:hover { opacity: 1; }
        .land-card.lc-dragging { outline: 2px dashed #f97316; outline-offset: 3px; opacity: .85; }
        .land-card.lc-resizing { outline: 2px solid rgba(249, 115, 22, .6); outline-offset: 3px; }
        body.lc-busy, body.lc-busy * { user-select: none !important; }
        body.lc-busy .lc-move { cursor: grabbing; }
        .board-hint { display: flex; align-items: center; justify-content: flex-end; gap: .75rem; font-size: 11px; color: var(--faint); margin: -.75rem 0 -.75rem; }
        .rec-mini { display: flex; align-items: center; gap: .55rem; margin-left: auto; }
        .rec-mini-legend { display: flex; flex-direction: column; gap: .1rem; font-size: 10px; color: var(--muted); line-height: 1.25; }
        .rec-mini-legend b { color: var(--text); font-weight: 800; margin-left: .2rem; }
        .rec-mini-legend .sw { display: inline-block; width: .5rem; height: .5rem; border-radius: 2px; margin-right: .3rem; }
        .sbar { position: relative; height: 6px; border-radius: 999px; background: var(--surface3); overflow: hidden; }
        .sbar > i { display: block; height: 100%; border-radius: inherit; background: #f97316; transition: width .25s ease; }
        .sbar.done > i { background: #10b981; }
        .sbar.fail > i { background: #dc2626; }
        .sbar.ind > i { width: 35% !important; animation: sbarMove 1.1s ease-in-out infinite; }
        @keyframes sbarMove { 0% { transform: translateX(-110%); } 100% { transform: translateX(310%); } }
        .sync-item { display: grid; grid-template-columns: 1rem minmax(0, 1fr) auto; gap: .2rem .55rem; align-items: center; font-size: 11.5px; }
        .sync-item .sbar { grid-column: 2 / -1; height: 4px; }
        .scan-view-btn { display: inline-flex; align-items: center; justify-content: center; gap: .35rem; height: 2.6rem; padding: 0 .7rem; border-radius: .8rem; border: 1px solid var(--border); background: var(--surface3); color: var(--text); font-size: .72rem; font-weight: 700; cursor: pointer; flex-shrink: 0; }
        @media (max-width: 420px) { .scan-view-btn .svb-t { display: none; } }
        .sh-mono { display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.6rem; letter-spacing: .02em; color: #fff; background: linear-gradient(135deg, #f97316, #c2410c); }
        @media (min-width: 640px) { .sh-mono { font-size: 2.6rem; } }
        @media (min-width: 1280px) { .sh-mono { font-size: 3.2rem; } }
        .sh-cover.hidden { display: none !important; }
        .sh-contact { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .9rem; font-size: .78rem; padding: .5rem .75rem; border-radius: .8rem; background: var(--surface2); border: 1px solid var(--border); width: fit-content; max-width: 100%; }
        .sh-contact .eyebrow { font-size: .58rem; }
        .kpi { background: var(--surface2); border: 1px solid var(--border); border-radius: .9rem; padding: .7rem .85rem; min-width: 0; }
        .kpi-k { font-size: .6rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
        .kpi-v { font-size: 1.6rem; font-weight: 900; line-height: 1.15; margin-top: .15rem; }
        .kpi-v-sm { font-size: 1.05rem; line-height: 1.3; margin-top: .3rem; }
        .kpi-s { font-size: 10.5px; color: var(--faint); margin-top: .1rem; line-height: 1.3; }
        @media (min-width: 640px) { .kpi { padding: .85rem 1rem; } .kpi-v { font-size: 1.85rem; } .kpi-v-sm { font-size: 1.15rem; } }
        .site-top { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; align-items: start; }
        .site-top .st-title { order: 1; } .site-top .st-actions { order: 2; } .site-top .st-contact { order: 3; }
        .st-actions { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; }
        .st-actions .st-start { grid-column: 1 / -1; }
        @media (min-width: 1024px) {
            .site-top { grid-template-columns: minmax(0, 1fr) 17rem; }
            .site-top .st-contact { grid-column: 1 / -1; }
        }
        @media (min-width: 1280px) {
            .site-top { grid-template-columns: minmax(0, 1.2fr) minmax(16rem, 1fr) 14rem; gap: 1.5rem; }
            .site-top .st-contact { grid-column: auto; order: 2; align-self: stretch; }
            .site-top .st-actions { order: 3; }
        }
        .station-thumb { width: 3.25rem; height: 3.25rem; border-radius: .6rem; overflow: hidden; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-size: 1rem; opacity: .9; }
        .station-thumb img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
        .nf-grid { display: grid !important; grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr)); gap: .75rem; align-content: start; padding: .2rem; }
        .nf-grid > * { margin: 0 !important; }
        .nf-grid > :not(.nf-card) { grid-column: 1 / -1; }
        .nf-card { display: block; width: 100%; text-align: left; border-radius: .9rem; overflow: hidden; background: var(--surface2); border: 1px solid var(--border); cursor: pointer; transition: transform .18s ease, box-shadow .18s ease, border-color .18s; }
        .nf-card:hover, .nf-card:focus-visible { transform: translateY(-2px) scale(1.02); box-shadow: 0 12px 28px rgba(0, 0, 0, .28); border-color: var(--accent, #f97316); outline: none; }
        .nf-card.nf-done { opacity: .75; }
        .nf-hero { position: relative; aspect-ratio: 16 / 10; background: radial-gradient(120% 90% at 30% 20%, color-mix(in srgb, var(--tc, #f97316) 45%, transparent), transparent 70%), var(--surface3); overflow: hidden; }
        .nf-img { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .nf-img img, .nf-img video { width: 100%; height: 100%; object-fit: cover; transition: transform .35s ease; }
        .nf-card:hover .nf-img img, .nf-card:hover .nf-img video { transform: scale(1.06); }
        .nf-ph { font-size: 2rem; opacity: .55; }
        .nf-play { position: absolute; width: 2.2rem; height: 2.2rem; border-radius: 999px; background: rgba(0, 0, 0, .55); color: #fff; display: flex; align-items: center; justify-content: center; font-size: .8rem; }
        .nf-shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0, 0, 0, .85) 0%, rgba(0, 0, 0, .35) 45%, rgba(0, 0, 0, 0) 70%, rgba(0, 0, 0, .35) 100%); pointer-events: none; }
        .nf-top { position: absolute; top: .4rem; left: .4rem; right: .4rem; display: flex; flex-wrap: wrap; gap: .25rem; }
        .nf-top .chip { font-size: 9.5px; padding: .1rem .4rem; backdrop-filter: blur(4px); }
        /* ================= RECOMMENDATION TEXT SIZE INCREASED BY 35% ================= */
        .nf-title { position: absolute; left: .55rem; right: .55rem; bottom: .45rem; color: #fff; font-weight: 800; font-size: 1.05rem; line-height: 1.2; text-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
        .nf-cat { display: inline-block; font-size: 12.15px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: #fdba74; margin-bottom: .1rem; }
        .nf-dot { width: .55rem; height: .55rem; border-radius: 999px; flex-shrink: 0; box-shadow: 0 0 0 2px rgba(255, 255, 255, .7); }
        .nf-meta { padding: .5rem .6rem .55rem; font-size: 14.85px; }
        /* Recommendation text instances in lists and modals adjusted by 35% */
        #siteLandingRecsList, #pastRecommendationsList, #recModalTitle { font-size: 1.05rem !important; }
        .rec-no { color: #f97316 !important; }
        .sight-card.sight-new { border-color: rgba(220, 38, 38, .6); }
