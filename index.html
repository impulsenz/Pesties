<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pestis - Enterprise Field Operations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            400: '#fb923c',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                            900: '#7c2d12',
                            950: '#431407'
                        }
                    }
                }
            }
        }
    </script>
    <script>
        try { if (localStorage.getItem('pestis-theme') === 'light') document.documentElement.classList.remove('dark'); } catch (e) {}
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --bg: #f3f5fa;
            --surface: #ffffff;
            --surface2: #f4f6fb;
            --surface3: #e7ebf5;
            --field: #ffffff;
            --border: #d8deeb;
            --text: #0b1530;
            --muted: #4b5a78;
            --faint: #7b88a3;
            --accent: #f97316;
            --accent-text: #c2410c;
            --header-bg: rgba(255, 255, 255, .88);
            --shadow: 0 10px 30px -14px rgba(15, 23, 42, .22);
            --overlay: rgba(15, 23, 42, .55);
        }
        html.dark {
            --bg: #060d1f;
            --surface: #0c1733;
            --surface2: #091229;
            --surface3: #16244a;
            --field: #0f1c3d;
            --border: #1d2d58;
            --text: #f1f5f9;
            --muted: #9db0d1;
            --faint: #6b7fa6;
            --accent: #fb923c;
            --accent-text: #fb923c;
            --header-bg: rgba(9, 18, 42, .85);
            --shadow: 0 20px 40px -22px rgba(0, 0, 0, .75);
            --overlay: rgba(3, 8, 22, .82);
        }

        body { background: var(--bg); color: var(--text); }
        ::selection { background: #f97316; color: #fff; }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 1.1rem; box-shadow: var(--shadow); }
        .inset { background: var(--surface2); border: 1px solid var(--border); border-radius: .85rem; }
        .app-header { background: var(--header-bg); border-bottom: 1px solid var(--border); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .divider { border-color: var(--border); }
        .overlay { background: var(--overlay); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
        .logo-tile { background: #000; border-radius: .8rem; padding: 3px; border: 1px solid var(--border); display: inline-flex; }

        .t-strong { color: var(--text); }
        .t-muted { color: var(--muted); }
        .t-faint { color: var(--faint); }
        .t-accent { color: var(--accent-text); }
        .lbl { display: block; font-size: .75rem; font-weight: 500; color: var(--muted); margin-bottom: .25rem; }
        .eyebrow { font-size: .62rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }

        .field { width: 100%; background: var(--field); border: 1px solid var(--border); color: var(--text); border-radius: .75rem; padding: .7rem .85rem; font-size: .875rem; outline: none; transition: border-color .15s, box-shadow .15s; }
        .field::placeholder { color: var(--faint); }
        .field:focus { border-color: #f97316; box-shadow: 0 0 0 3px rgba(249, 115, 22, .18); }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; font-weight: 800; font-size: .75rem; padding: .7rem 1.1rem; border-radius: .8rem; cursor: pointer; transition: all .15s ease; border: 1px solid transparent; white-space: nowrap; }
        .btn:hover { filter: brightness(1.08); }
        .btn:active { transform: scale(.98); }
        .btn-primary { background: linear-gradient(90deg, #ea580c, #f97316); color: #fff; box-shadow: 0 8px 20px -10px rgba(249, 115, 22, .8); }
        .btn-secondary { background: var(--surface3); color: var(--text); border-color: var(--border); }
        .btn-blue { background: #1d4ed8; color: #fff; }
        .btn-danger { background: #dc2626; color: #fff; }
        .btn-outline-danger { background: transparent; color: #dc2626; border-color: #dc2626; }
        html.dark .btn-outline-danger { color: #f87171; border-color: #f87171; }
        .btn-outline-danger:hover { background: rgba(220, 38, 38, .1); }
        .btn-white { background: #fff; color: #0f172a; border-color: #d8deeb; }
        .icon-btn { width: 2.5rem; height: 2.5rem; display: inline-flex; align-items: center; justify-content: center; border-radius: .8rem; background: var(--surface3); border: 1px solid var(--border); color: var(--text); cursor: pointer; transition: all .15s; }
        .icon-btn:hover { border-color: #f97316; color: var(--accent-text); }
        .icon-sun { display: none; }
        html.dark .icon-sun { display: inline; }
        html.dark .icon-moon { display: none; }

        .chip { display: inline-flex; align-items: center; gap: .35rem; padding: .22rem .65rem; border-radius: .65rem; font-size: .7rem; font-weight: 700; border: 1px solid; white-space: nowrap; }
        .chip-green { color: #047857; background: #d1fae5; border-color: #6ee7b7; }
        html.dark .chip-green { color: #34d399; background: rgba(16, 185, 129, .12); border-color: rgba(16, 185, 129, .3); }

        .site-card { position: relative; display: block; width: 100%; aspect-ratio: 4 / 3; border-radius: 1rem; overflow: hidden; text-align: left; cursor: pointer; border: 1px solid rgba(255, 255, 255, .08); transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; box-shadow: var(--shadow); }
        .site-card:hover, .site-card:focus-visible { transform: translateY(-4px) scale(1.03); box-shadow: 0 18px 40px -14px rgba(249, 115, 22, .6); border-color: #fb923c; outline: none; }
        .site-initials { position: absolute; right: .8rem; top: .2rem; font-size: 4.5rem; font-weight: 900; color: rgba(255, 255, 255, .15); line-height: 1; pointer-events: none; }
        .site-overlay { position: absolute; left: 0; right: 0; bottom: 0; padding: 2.6rem .95rem .85rem; background: linear-gradient(to top, rgba(2, 6, 23, .94), rgba(2, 6, 23, 0)); display: flex; flex-direction: column; gap: .12rem; }
        .site-name { color: #fff; font-weight: 800; font-size: .95rem; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .site-addr { color: rgba(255, 255, 255, .78); font-size: .72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .site-open { position: absolute; top: .7rem; left: .7rem; font-size: .65rem; font-weight: 800; color: #fff; background: #f97316; padding: .22rem .6rem; border-radius: .5rem; opacity: 0; transform: translateY(-4px); transition: all .2s ease; }
        .site-card:hover .site-open, .site-card:focus-visible .site-open { opacity: 1; transform: none; }
        
        .scroll-thin { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col">

    <!-- ===================== LOGIN SCREEN ===================== -->
    <div id="loginScreen" class="fixed inset-0 z-[70] flex items-center justify-center p-6" style="background: var(--bg);">
        <button type="button" onclick="toggleTheme()" class="icon-btn absolute top-4 right-4" title="Toggle day / night mode">
            <svg class="icon-sun w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364-6.364l-1.414 1.414M7.05 16.95l-1.414 1.414m12.728 0l-1.414-1.414M7.05 7.05L5.636 5.636M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg class="icon-moon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>

        <div class="card p-8 max-w-sm w-full text-center space-y-5">
            <div class="logo-tile mx-auto"><img src="images/pesties-logo.png" alt="Pesties" class="w-52 max-w-full object-contain rounded-lg"></div>
            <p id="authLoading" class="text-xs t-muted italic">Checking session...</p>
            <div id="loginPanel" class="hidden space-y-4">
                <p class="text-xs t-muted">Sign in with your authorized Google account to continue.</p>
                <button type="button" onclick="signInWithGoogle()" class="btn btn-white w-full !py-3 !text-sm">
                    <svg class="w-5 h-5" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                    Sign in with Google
                </button>
            </div>
            <p id="loginMessage" class="text-xs hidden leading-relaxed" style="color:#ef4444;"></p>
        </div>
    </div>

    <!-- ===================== APP HEADER ===================== -->
    <header id="appHeader" class="app-header hidden sticky top-0 z-40 w-full">
        <div class="max-w-[1800px] mx-auto px-4 sm:px-6 lg:px-10 py-2.5 flex justify-between items-center gap-3">
            <div class="logo-tile"><img src="images/pesties-logo.png" alt="Pesties" class="h-12 sm:h-14 w-auto rounded-lg"></div>
            <div class="flex items-center gap-2 sm:gap-3">
                <div id="syncStatusBadge" class="chip chip-green transition-all duration-300">
                    <span id="syncDot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span id="syncText" class="hidden sm:inline">Online & Synced</span>
                </div>
                <button type="button" onclick="toggleTheme()" class="icon-btn" title="Toggle day / night mode">
                    <svg class="icon-sun w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364-6.364l-1.414 1.414M7.05 16.95l-1.414 1.414m12.728 0l-1.414-1.414M7.05 7.05L5.636 5.636M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg class="icon-moon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
                <button type="button" onclick="signOut()" class="btn btn-secondary !py-2 !px-3 text-xs">Sign Out</button>
            </div>
        </div>
    </header>

    <!-- ===================== MAIN ===================== -->
    <main id="appRoot" class="hidden flex-1 w-full max-w-[1800px] mx-auto px-4 sm:px-6 lg:px-10 py-6 lg:py-8 space-y-6">
        <section id="siteSelectorSection" class="space-y-5">
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
                <div>
                    <span class="eyebrow t-accent">Site Management</span>
                    <h2 class="text-2xl lg:text-3xl font-black t-strong mt-1">Choose a Customer Site</h2>
                    <p class="text-xs t-muted mt-1">Tap a site to open its dashboard.</p>
                </div>
                <div class="flex flex-col sm:flex-row gap-3 md:items-center">
                    <div class="relative w-full sm:w-72">
                        <div class="absolute inset-y-0 left-3.5 flex items-center pointer-events-none t-faint">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                        <input type="text" id="siteSearchInput" oninput="renderSiteCards()" placeholder="Search sites..." class="field !pl-10">
                    </div>
                </div>
            </div>
            <div id="siteCardsGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-4 lg:gap-5">
                <span class="text-xs t-muted italic col-span-full">Loading sites from database...</span>
            </div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = 'https://gxxyxknzyzaexdufliwv.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ESTd1a8NRdN7LIxbsD_RuQ_AtmPlxRT';
        
        window.supabaseClient = window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { 
                persistSession: true, 
                autoRefreshToken: true,
                detectSessionInUrl: true 
            }
        });
        const db = window.supabaseClient;

        let sitesData = [];

        async function initAuth() {
            const authLoading = document.getElementById('authLoading');
            const loginPanel = document.getElementById('loginPanel');
            const loginScreen = document.getElementById('loginScreen');
            const appHeader = document.getElementById('appHeader');
            const appRoot = document.getElementById('appRoot');

            try {
                const { data: { session }, error } = await db.auth.getSession();
                if (error) throw error;

                if (session && session.user) {
                    loginScreen.classList.add('hidden');
                    appHeader.classList.remove('hidden');
                    appRoot.classList.remove('hidden');
                    
                    await fetchSites();
                } else {
                    authLoading.classList.add('hidden');
                    loginPanel.classList.remove('hidden');
                }
            } catch (err) {
                authLoading.classList.add('hidden');
                loginPanel.classList.remove('hidden');
                document.getElementById('loginMessage').textContent = err.message;
                document.getElementById('loginMessage').classList.remove('hidden');
            }
        }

        async function fetchSites() {
            const grid = document.getElementById('siteCardsGrid');
            try {
                const { data, error } = await db.from('sites').select('*');
                if (error) throw error;

                sitesData = data || [];
                renderSiteCards();
            } catch (err) {
                console.error("Error fetching sites:", err);
                grid.innerHTML = `<span class="text-xs text-red-500 italic col-span-full">Error loading sites: ${err.message}</span>`;
            }
        }

        function renderSiteCards() {
            const grid = document.getElementById('siteCardsGrid');
            const query = (document.getElementById('siteSearchInput').value || '').toLowerCase();
            
            const filtered = sitesData.filter(s => 
                (s.name && s.name.toLowerCase().includes(query)) || 
                (s.address && s.address.toLowerCase().includes(query))
            );

            if (filtered.length === 0) {
                grid.innerHTML = `<span class="text-xs t-muted italic col-span-full">No customer sites found.</span>`;
                return;
            }

            const gradients = [
                'linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%)',
                'linear-gradient(135deg, #7c2d12 0%, #431407 100%)',
                'linear-gradient(135deg, #065f46 0%, #022c22 100%)',
                'linear-gradient(135deg, #581c87 0%, #3b0764 100%)'
            ];

            grid.innerHTML = filtered.map((site, idx) => {
                const bg = gradients[idx % gradients.length];
                const initials = (site.name || 'Site').split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
                return `
                    <div class="site-card" style="background: ${bg};" onclick="alert('Opened site: ${site.name}')">
                        <span class="site-initials">${initials}</span>
                        <div class="site-open">Open Site</div>
                        <div class="site-overlay">
                            <h3 class="site-name">${escapeHtml(site.name || 'Unnamed Site')}</h3>
                            <p class="site-addr">${escapeHtml(site.address || 'No address specified')}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        async function signInWithGoogle() {
            const { error } = await db.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin + window.location.pathname }
            });
            if (error) {
                const msg = document.getElementById('loginMessage');
                msg.textContent = error.message;
                msg.classList.remove('hidden');
            }
        }

        async function signOut() {
            await db.auth.signOut();
            window.location.reload();
        }

        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('pestis-theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('pestis-theme', 'dark');
            }
        }

        window.addEventListener('DOMContentLoaded', initAuth);
    </script>
</body>
</html>
