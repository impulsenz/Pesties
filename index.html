<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PestGuard NZ - MPI Compliance & Service Suite</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Canvas Confetti for audit approval -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-full bg-slate-900 text-slate-100 flex flex-col overflow-hidden">

    <!-- Top Navigation Bar -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex items-center justify-between z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-emerald-600 p-2 rounded-xl text-white shadow-lg flex items-center justify-center">
                <i data-lucide="shield-check" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg text-white flex items-center gap-2">
                    PestGuard NZ 
                    <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/30">MPI Audit Ready</span>
                </h1>
                <p class="text-xs text-slate-400">Biosecurity & Food Safety Compliance Suite</p>
            </div>
        </div>

        <!-- User profile & Sync status -->
        <div class="flex items-center space-x-3">
            <div id="sync-badge" class="hidden sm:flex items-center gap-1.5 text-xs bg-amber-500/10 text-amber-400 px-2.5 py-1 rounded-full border border-amber-500/30">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                <span id="sync-text">Offline Queue (2)</span>
            </div>
            
            <div id="auth-container">
                <!-- Injected via JS -->
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- Mobile Bottom Nav / Desktop Sidebar -->
        <nav id="sidebar" class="bg-slate-800/90 backdrop-blur border-r border-slate-700 flex md:flex-col justify-around md:justify-start md:w-64 shrink-0 z-10 order-2 md:order-1">
            <div class="hidden md:block p-4 border-b border-slate-700">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Navigation Menu</span>
            </div>
            <div class="flex md:flex-col w-full p-2 space-x-1 md:space-x-0 md:space-y-1">
                <button onclick="switchTab('dashboard')" class="nav-btn flex-1 md:flex-initial flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-emerald-400 bg-emerald-500/10" data-tab="dashboard">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    <span class="hidden md:inline">Dashboard & Calendar</span>
                </button>
                <button onclick="switchTab('clients')" class="nav-btn flex-1 md:flex-initial flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-400 hover:text-white hover:bg-slate-700/50" data-tab="clients">
                    <i data-lucide="building-2" class="w-5 h-5"></i>
                    <span class="hidden md:inline">Clients & Sites</span>
                </button>
                <button onclick="switchTab('scanning')" class="nav-btn flex-1 md:flex-initial flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-400 hover:text-white hover:bg-slate-700/50" data-tab="scanning">
                    <i data-lucide="scan-line" class="w-5 h-5"></i>
                    <span class="hidden md:inline">Station Logging</span>
                </button>
                <button onclick="switchTab('mapping')" class="nav-btn flex-1 md:flex-initial flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-400 hover:text-white hover:bg-slate-700/50" data-tab="mapping">
                    <i data-lucide="map" class="w-5 h-5"></i>
                    <span class="hidden md:inline">Digital Floorplan Pins</span>
                </button>
                <button onclick="switchTab('audit')" class="nav-btn flex-1 md:flex-initial flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-400 hover:text-white hover:bg-slate-700/50" data-tab="audit">
                    <i data-lucide="file-spreadsheet" class="w-5 h-5"></i>
                    <span class="hidden md:inline">MPI Audit & Reports</span>
                </button>
                <button onclick="switchTab('admin')" class="nav-btn flex-1 md:flex-initial flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-400 hover:text-white hover:bg-slate-700/50" data-tab="admin">
                    <i data-lucide="shield-alert" class="w-5 h-5"></i>
                    <span class="hidden md:inline">Admin Override Log</span>
                </button>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto bg-slate-900 p-4 md:p-6 order-1 md:order-2" id="main-content">
            <!-- Dynamic Tab Content Injected Here -->
        </main>
    </div>

    <!-- Modal Container -->
    <div id="modal-container" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div id="modal-content" class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl p-6">
            <!-- Modal content injected here -->
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-20 right-4 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-800 border border-slate-700 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3">
        <div id="toast-icon"></div>
        <div>
            <h4 id="toast-title" class="font-semibold text-sm"></h4>
            <p id="toast-message" class="text-xs text-slate-300"></p>
        </div>
    </div>

    <!-- Application Logic Script -->
    <script>

                    type: 'HD Commercial',

                    score: '94%'
                },
                {

                { id: 'job-2', time: '11:30 - 13:00', client: 'Waikato Dairy Exporters Co-op', address: '185 Te Rapa Road, Hamilton', scope: 'Critical Control Point Inspection & Cockroach Gel Application', status: 'In Progress', gcalSynced: true },
                { id: 'job-3', time: '14:30 - 16:00', client: 'Mt Maunganui Cold Storage Hub', address: '98 Portside Drive, Mt Maunganui', scope: 'Fly Light Tube Replacement & Stored Product Insect Inspection', status: 'Scheduled', gcalSynced: false }
            ],
            stations: [
                { id: 'STN-01', name: 'External Perimeter Bait Station #1', type: 'toxic', prep: 'Brodifacoum Rodent Bait (0.005g/kg)', batch: 'BF-2026-884A', qty: '2 blocks', activity: 'Low', status: 'Serviced', client: 'Auckland Seafood Processors Ltd' },
                { id: 'STN-02', name: 'Loading Bay Non-Toxic Monitor #2', type: 'nontoxic', prep: 'Non-Toxic Monitoring Blocks', batch: 'NTB-992', qty: '1 block', activity: 'None', status: 'Serviced', client: 'Auckland Seafood Processors Ltd' },
                { id: 'STN-03', name: 'Warehouse EFK Unit #1', type: 'efk', prep: 'Glue Board & UV Tubes', batch: 'UV-441-X', qty: '1 board', activity: 'Medium (Flies)', status: 'Serviced', client: 'Auckland Seafood Processors Ltd' },
                { id: 'STN-04', name: 'Kitchen Crawling Insect Trap #4', type: 'trap', prep: 'Alpha-Cypermethrin Spray & Pheromone Trap', batch: 'AC-7712', qty: '50ml', activity: 'None', status: 'Pending', client: 'Auckland Seafood Processors Ltd' },
                { id: 'STN-05', name: 'Coolstore CCP Door Check', type: 'ccp', prep: 'Silseal Brush Strip & Inspection', batch: 'N/A', qty: '1 unit', activity: 'None', status: 'Pending', client: 'Auckland Seafood Processors Ltd' }
            ],
            recommendations: [
                { id: 'rec-1', client: 'Auckland Seafood Processors Ltd', date: '2026-10-16', priority: 'Critical', text: 'Roller shutter door gap at Bay 3 exceeds 10mm allowing rodent ingress. Install brush seals immediately.', status: 'Open', photo: 'https://placehold.co/300x200/334155/ffffff?text=Door+Gap+Bay+3' },
                { id: 'rec-2', client: 'Waikato Dairy Exporters Co-op', date: '2026-10-15', priority: 'Medium', text: 'Water pooling near pallet racking creates conducive conditions for insect breeding. Clear drainage.', status: 'In Progress', photo: 'https://placehold.co/300x200/334155/ffffff?text=Drainage+Pooling' }
            ],
            adminLogs: [
                { id: 'log-1', admin: 'Admin (Sarah Boss)', action: 'Overrode Station STN-01 Batch Number from BF-2026-883 to BF-2026-884A', timestamp: '2026-10-15 14:22', reason: 'Technician typographical error correction per invoice verification.' },
                { id: 'log-2', admin: 'Admin (Sarah Boss)', action: 'Deleted duplicate station log for Greenlane Residential', timestamp: '2026-10-12 09:10', reason: 'Duplicate scan during network retry.' }
            ]
        };

        let state = JSON.parse(localStorage.getItem('pestguard_state')) || DEFAULT_STATE;

        function saveState() {
            localStorage.setItem('pestguard_state', JSON.stringify(state));
        }

        // --- Initialization ---
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            renderAuthWidget();
            renderSyncBadge();
            switchTab(state.activeTab);
            
            // Resume timer if active
            if(state.timerRunning && state.startTime) {
                startTimerInterval();
            }
        });

        // --- Navigation & UI Router ---
        function switchTab(tabId) {
            state.activeTab = tabId;
            saveState();

            // Update nav styles
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if(btn.dataset.tab === tabId) {
                    btn.className = "nav-btn flex-1 md:flex-initial flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-emerald-400 bg-emerald-500/10";
                } else {
                    btn.className = "nav-btn flex-1 md:flex-initial flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-400 hover:text-white hover:bg-slate-700/50";
                }
            });

            const content = document.getElementById('main-content');
            content.innerHTML = '';

            switch(tabId) {
                case 'dashboard': renderDashboard(content); break;
                case 'clients': renderClients(content); break;
                case 'scanning': renderScanning(content); break;
                case 'mapping': renderMapping(content); break;
                case 'audit': renderAudit(content); break;
                case 'admin': renderAdmin(content); break;
            }
            lucide.createIcons();
        }

        // --- Auth & User Widget ---
        function renderAuthWidget() {
            const container = document.getElementById('auth-container');
            if (state.isLoggedIn) {
                container.innerHTML = `
                    <div class="flex items-center gap-3 bg-slate-700/50 border border-slate-600/50 px-3 py-1.5 rounded-xl">
                        <img src="${state.user.avatar}" class="w-8 h-8 rounded-full border border-emerald-500" alt="User">
                        <div class="hidden lg:block text-left">
                            <p class="text-xs font-semibold text-white">${state.user.name}</p>
                            <p class="text-[10px] text-emerald-400">${state.user.role}</p>
                        </div>
                        <button onclick="toggleAuth()" class="text-slate-400 hover:text-rose-400 ml-2" title="Sign Out">
                            <i data-lucide="log-out" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <button onclick="toggleAuth()" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-1.5 rounded-xl text-xs font-semibold transition shadow-lg">
                        <i data-lucide="log-in" class="w-4 h-4"></i>
                        <span>Google Sign-In</span>
                    </button>
                `;
            }
            lucide.createIcons();
        }

        function toggleAuth() {
            state.isLoggedIn = !state.isLoggedIn;
            saveState();
            renderAuthWidget();
            showToast(state.isLoggedIn ? "Google OAuth Successful" : "Signed Out", state.isLoggedIn ? "Welcome back, Hemi McGregor" : "Session terminated safely", "success");
        }

        function renderSyncBadge() {
            const badge = document.getElementById('sync-badge');
            const text = document.getElementById('sync-text');
            if(state.offlineQueue.length > 0) {
                badge.classList.remove('hidden');
                badge.classList.add('flex');
                text.innerText = `Offline Queue (${state.offlineQueue.length})`;
            } else {
                badge.classList.add('hidden');
            }
        }

        // --- Toast Notification ---
        function showToast(title, message, type = 'success') {
            const toast = document.getElementById('toast');
            const titleEl = document.getElementById('toast-title');
            const msgEl = document.getElementById('toast-message');
            const iconEl = document.getElementById('toast-icon');

            titleEl.innerText = title;
            msgEl.innerText = message;
            iconEl.innerHTML = type === 'success' 
                ? '<i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400"></i>' 
                : '<i data-lucide="alert-circle" class="w-5 h-5 text-amber-400"></i>';
            
            lucide.createIcons();
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 4000);
        }

        // --- TAB 1: Dashboard & Google Calendar ---
        function renderDashboard(container) {
            const activeVisitHtml = state.timerRunning ? `
                <div class="bg-gradient-to-r from-emerald-900/40 to-slate-800 border border-emerald-500/40 p-5 rounded-2xl mb-6 shadow-xl flex flex-col md:flex-row items-center justify-between gap-4">
                    <div class="flex items-center gap-4">
                        <div class="bg-emerald-500/20 text-emerald-400 p-3 rounded-xl border border-emerald-500/30 animate-pulse">
                            <i data-lucide="timer" class="w-8 h-8"></i>
                        </div>
                        <div>
                            <span class="text-xs bg-emerald-500 text-slate-950 font-bold px-2 py-0.5 rounded uppercase tracking-wider">Active Visit Timer</span>
                            <h3 class="text-lg font-bold text-white mt-1">${state.activeClientVisit || 'Auckland Seafood Processors Ltd'}</h3>
                            <p class="text-xs text-slate-300">Started at: ${new Date(state.startTime).toLocaleTimeString()}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4 w-full md:w-auto justify-end">
                        <div class="text-3xl font-mono font-bold text-emerald-400 bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-700" id="timer-display">
                            00:00:00
                        </div>
                        <button onclick="stopVisitTimer()" class="bg-rose-600 hover:bg-rose-500 text-white px-5 py-3 rounded-xl text-sm font-semibold transition shadow-lg flex items-center gap-2">
                            <i data-lucide="square" class="w-4 h-4 fill-current"></i> End & Sign Off
                        </button>
                    </div>
                </div>
            ` : '';

            container.innerHTML = `

                    <!-- Welcome & Quick Status -->
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-800/60 border border-slate-700/60 p-6 rounded-2xl backdrop-blur">
                        <div>
                            <h2 class="text-2xl font-bold text-white flex items-center gap-2">
                                Field Technician Operations 
                                <span class="text-xs bg-blue-500/20 text-blue-400 px-2.5 py-0.5 rounded-full border border-blue-500/30">Google Calendar Synced</span>
                            </h2>
                            <p class="text-sm text-slate-400 mt-1">Today: ${new Date().toLocaleDateString('en-NZ', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })} • New Zealand Standard Time</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="syncGoogleCalendar()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2.5 rounded-xl text-xs font-semibold transition flex items-center gap-2 border border-slate-600">
                                <i data-lucide="refresh-cw" class="w-4 h-4"></i> Sync Google Calendar
                            </button>
                            ${!state.timerRunning ? `
                                <button onclick="startVisitTimer('Auckland Seafood Processors Ltd')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-xl text-xs font-semibold transition flex items-center gap-2 shadow-lg">
                                    <i data-lucide="play" class="w-4 h-4 fill-current"></i> Start Quick Site Visit
                                </button>
                            ` : ''}
                        </div>
                    </div>

                    ${activeVisitHtml}

                    <!-- Grid Stats -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-slate-800/80 border border-slate-700 p-5 rounded-2xl shadow-lg">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Scheduled Jobs Today</span>
                                <div class="bg-blue-500/10 text-blue-400 p-2.5 rounded-xl"><i data-lucide="calendar" class="w-5 h-5"></i></div>
                            </div>
                            <h3 class="text-3xl font-bold text-white mt-3">3 Sites</h3>
                            <p class="text-xs text-emerald-400 mt-1 flex items-center gap-1"><i data-lucide="check" class="w-3.5 h-3.5"></i> 1 Completed, 1 In Progress</p>
                        </div>
                        <div class="bg-slate-800/80 border border-slate-700 p-5 rounded-2xl shadow-lg">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Stations Scanned</span>
                                <div class="bg-emerald-500/10 text-emerald-400 p-2.5 rounded-xl"><i data-lucide="scan-line" class="w-5 h-5"></i></div>
                            </div>
                            <h3 class="text-3xl font-bold text-white mt-3">24 / 28</h3>
                            <p class="text-xs text-slate-400 mt-1">85.7% compliance rate today</p>
                        </div>
                        <div class="bg-slate-800/80 border border-slate-700 p-5 rounded-2xl shadow-lg">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Open Audit Risks</span>
                                <div class="bg-rose-500/10 text-rose-400 p-2.5 rounded-xl"><i data-lucide="alert-triangle" class="w-5 h-5"></i></div>
                            </div>
                            <h3 class="text-3xl font-bold text-white mt-3">${state.recommendations.filter(r => r.status === 'Open').length} Items</h3>
                            <p class="text-xs text-rose-400 mt-1">Requires corrective action</p>
                        </div>
                        <div class="bg-slate-800/80 border border-slate-700 p-5 rounded-2xl shadow-lg">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Offline Queue</span>
                                <div class="bg-amber-500/10 text-amber-400 p-2.5 rounded-xl"><i data-lucide="cloud-off" class="w-5 h-5"></i></div>
                            </div>
                            <h3 class="text-3xl font-bold text-white mt-3">${state.offlineQueue.length} Pending</h3>
                            <button onclick="syncOfflineQueue()" class="text-xs text-amber-400 hover:underline mt-1 block">Sync to Cloud Now</button>

                    </div>

                    <!-- Google Calendar Job List -->
                    <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-6 shadow-xl">

                            <h3 class="font-bold text-lg text-white flex items-center gap-2">
                                <i data-lucide="calendar-days" class="w-5 h-5 text-blue-400"></i> Google Calendar Appointments (Today)
                            </h3>
                            <span class="text-xs bg-blue-500/20 text-blue-400 px-2.5 py-1 rounded-full border border-blue-500/30">Auto-Synced with GCal</span>
                        </div>
                        <div class="space-y-3">
                            ${state.calendarJobs.map(job => `
                                <div class="bg-slate-900/60 border border-slate-700/70 p-4 rounded-xl flex flex-col md:flex-row md:items-center justify-between gap-4">

                                        <div class="bg-slate-800 text-slate-300 font-mono text-xs px-3 py-2 rounded-lg border border-slate-700 text-center shrink-0">
                                            ${job.time}

                                        <div>
                                            <h4 class="font-semibold text-white text-base">${job.client}</h4>

                                            <p class="text-xs text-emerald-400 mt-1 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20 inline-block">${job.scope}</p>

            clearInterval(state.timerInterval);

        }

        function startTimerInterval() {
            if(state.timerInterval) clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                const now = new Date().getTime();
                state.elapsedSeconds = Math.floor((now - state.startTime) / 1000);
                const display = document.getElementById('timer-display');
                if(display) {
                    const hrs = String(Math.floor(state.elapsedSeconds / 3600)).padStart(2, '0');
                    const mins = String(Math.floor((state.elapsedSeconds % 3600) / 60)).padStart(2, '0');
                    const secs = String(state.elapsedSeconds % 60).padStart(2, '0');
                    display.innerText = `${hrs}:${mins}:${secs}`;
                }
            }, 1000);
        }

                            <h3 class="font-bold text-lg text-white mb-2">Chemical Preparation Volume Breakdown</h3>
                            <p class="text-xs text-slate-400 mb-6">Traceability volume log for MPI chemical audit compliance</p>
                            <div class="space-y-4 pt-2">
                                <div>
                                    <div class="flex justify-between text-xs font-semibold mb-1">
                                        <span class="text-slate-300">Brodifacoum Rodent Bait</span>
                                        <span class="text-emerald-400">45.2 kg</span>
                                    </div>
                                    <div class="w-full bg-slate-900 h-3 rounded-full overflow-hidden border border-slate-700">
                                        <div class="bg-emerald-500 h-full w-3/4"></div>
                                    </div>
                                </div>
                                <div>
                                    <div class="flex justify-between text-xs font-semibold mb-1">
                                        <span class="text-slate-300">Alpha-Cypermethrin Spray</span>
                                        <span class="text-blue-400">120 L</span>
                                    </div>
                                    <div class="w-full bg-slate-900 h-3 rounded-full overflow-hidden border border-slate-700">
                                        <div class="bg-blue-500 h-full w-1/2"></div>
                                    </div>
                                </div>
                                <div>
                                    <div class="flex justify-between text-xs font-semibold mb-1">
                                        <span class="text-slate-300">Non-Toxic Monitoring Blocks</span>
                                        <span class="text-purple-400">85 units</span>
                                    </div>
                                    <div class="w-full bg-slate-900 h-3 rounded-full overflow-hidden border border-slate-700">
                                        <div class="bg-purple-500 h-full w-2/3"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Corrective Recommendations -->
                    <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-6 shadow-xl">
                        <h3 class="font-bold text-lg text-white mb-4">Corrective Action Recommendations & Risk Priority</h3>
                        <div class="space-y-4">
                            ${state.recommendations.map(rec => `
                                <div class="bg-slate-900/80 border border-slate-700 p-4 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div class="flex items-start gap-4">
                                        <img src="${rec.photo}" class="w-20 h-16 rounded-lg object-cover border border-slate-700 shrink-0" alt="Risk Photo">
                                        <div>
                                            <div class="flex items-center gap-2">
                                                <span class="text-xs px-2 py-0.5 rounded font-semibold ${rec.priority === 'Critical' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}">
                                                    ${rec.priority} Priority
                                                </span>
                                                <span class="text-xs text-slate-400">${rec.client} • ${rec.date}</span>
                                            </div>
                                            <p class="text-sm text-white font-medium mt-1">${rec.text}</p>
                                        </div>
                                    </div>
                                    <span class="text-xs px-3 py-1 rounded-full font-semibold bg-blue-500/20 text-blue-400 border border-blue-500/30">
                                        ${rec.status}
                                    </span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function generateMPIReport() {
            confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
            showToast("MPI Compliance Package Generated", "Comprehensive audit PDF successfully compiled and downloaded.", "success");
        }

        // --- TAB 6: Backend Admin Edit & Override Function ---
        function renderAdmin(container) {
            container.innerHTML = `
                <div class="max-w-7xl mx-auto space-y-6">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-800/60 border border-slate-700/60 p-6 rounded-2xl backdrop-blur">
                        <div>
                            <h2 class="text-2xl font-bold text-white flex items-center gap-2">
                                <i data-lucide="shield-alert" class="w-6 h-6 text-rose-400"></i> Admin Override & Audit Log
                            </h2>
                            <p class="text-sm text-slate-400 mt-1">Immutable regulatory audit trail for supervisor corrections and data integrity verification.</p>
                        </div>
                        <button onclick="openOverrideModal()" class="bg-rose-600 hover:bg-rose-500 text-white px-4 py-2.5 rounded-xl text-xs font-semibold transition flex items-center gap-2 shadow-lg">
                            <i data-lucide="edit-3" class="w-4 h-4"></i> Perform Admin Override
                        </button>
                    </div>

                    <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-6 shadow-xl">
                        <h3 class="font-bold text-lg text-white mb-4">Immutable Audit Trail History</h3>
                        <div class="space-y-4">
                            ${state.adminLogs.map(log => `
                                <div class="bg-slate-900/80 border border-slate-700 p-4 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                    <div>
                                        <div class="flex items-center gap-2">
                                            <span class="text-xs bg-purple-500/20 text-purple-400 px-2 py-0.5 rounded border border-purple-500/30 font-semibold">${log.admin}</span>
                                            <span class="text-xs text-slate-400">${log.timestamp}</span>
                                        </div>
                                        <p class="text-sm text-white font-medium mt-1.5">${log.action}</p>
                                        <p class="text-xs text-slate-400 mt-1"><strong>Reason:</strong> ${log.reason}</p>
                                    </div>
                                    <span class="text-xs text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">Verified Immutable</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function openOverrideModal() {
            openModal(`
                <h3 class="text-xl font-bold text-white mb-2">Admin Override & Correction</h3>
                <p class="text-xs text-slate-400 mb-6">All edits require an administrative reason per NZ MPI regulatory standards.</p>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Select Station / Record to Edit</label>
                        <select class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm">
                            <option>STN-01: Auckland Seafood Processors (Batch: BF-2026-884A)</option>
                            <option>STN-02: Auckland Seafood Processors (Batch: NTB-992)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Corrected Value</label>
                        <input type="text" value="BF-2026-885B" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Mandatory Audit Reason</label>
                        <textarea rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm" placeholder="Explain reason for administrative correction..."></textarea>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-3">
                    <button onclick="closeModal(); showToast('Override Saved', 'Administrative correction logged immutably.', 'success');" class="bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded-xl text-xs font-semibold">Commit Override</button>
                    <button onclick="closeModal()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl text-xs font-semibold">Cancel</button>
                </div>
            `);
        }

        function openNewClientModal() {
            openModal(`
                <h3 class="text-xl font-bold text-white mb-2">Add New Client Site</h3>
                <p class="text-xs text-slate-400 mb-6">Register a new residential or HD commercial food safety facility.</p>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Client Name</label>
                        <input type="text" id="new-c-name" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm" placeholder="e.g. Christchurch Export Abattoir">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Site Address</label>
                        <input type="text" id="new-c-addr" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm" placeholder="e.g. 12 Sockburn Road, Christchurch">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Site Classifier</label>
                        <select id="new-c-type" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm">
                            <option>HD Commercial</option>
                            <option>Commercial</option>
                            <option>Residential</option>
                        </select>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-3">
                    <button onclick="saveNewClient()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-semibold">Save Client</button>
                    <button onclick="closeModal()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl text-xs font-semibold">Cancel</button>
                </div>
            `);
        }

        function saveNewClient() {
            const name = document.getElementById('new-c-name').value;
            const address = document.getElementById('new-c-addr').value;
            const type = document.getElementById('new-c-type').value;
            if(!name) return;
            state.clients.unshift({ id: 'c-' + Date.now(), name, address, contact: 'New Contact', phone: '+64 21 000 0000', type, lat: -36.8, lng: 174.7, lastService: 'Never', score: '100%' });
            saveState();
            closeModal();
            switchTab('clients');
            showToast("Client Added", `${name} successfully registered.`, "success");
        }

        // Modal Helpers
        function openModal(html) {
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            content.innerHTML = html;
            container.classList.remove('hidden');
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('modal-container').classList.add('hidden');
        }
    </script>
</body>
</html>
