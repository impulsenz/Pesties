<title>Pestis Service App - Admin</title>
<!--
    PESTIS SERVICE APP - ADMIN
    ==========================
    Everything only admins use, kept up to date separately from index.html:
      * the Admin page: overview, users and approvals, Client Portal logins, services, documents,
        the station form lists, team settings, activity and exports
      * technician profiles shown to clients
      * giving client logins access to a site

    It isn't a page on its own: index.html loads it when the app starts (and the offline cache keeps a copy).
    Upload it next to index.html. Its code shares everything the app has (the site list, the sync queue, ...).

    Add-on version: 2026.10.21-a3   (written for the app's add-on hook-up version 1, see ADDON_API in index.html)
-->
<style>
                #adminProfilesList .saving { opacity: .75; }

</style>

<!-- The add-on's code. index.html runs it after the page parts are in place (type="text/plain" so it never runs here on its own). -->
<script type="text/plain" id="addonScript">
        // Tells index.html what loaded, and which version of the hook-up it was written for
        window.ADDON_INFO = { name: 'Admin', version: '2026.10.21-a3', api: 1 };

        async function loadAdminPanel() {
            const profList = document.getElementById('adminProfilesList');
            const allowedList = document.getElementById('adminAllowedList');
            if (!isOnline) {
                profList.innerHTML = '<span class="t-faint italic">Team access can only be managed while online.</span>';
                allowedList.innerHTML = '';
                return;
            }
            profList.innerHTML = '<span class="t-faint italic">Loading...</span>';
            allowedList.innerHTML = '';

            try {
                const [p, a] = await Promise.all([
                    _supabase.from('profiles').select('*').order('created_at', { ascending: true }),
                    _supabase.from('allowed_emails').select('*').order('added_at', { ascending: true })
                ]);
                if (p.error) throw p.error;
                if (a.error) throw a.error;
                adminProfiles = p.data || [];
                adminAllowed = a.data || [];
                const cu = await _supabase.from('client_users').select('*');
                if (cu && !cu.error) adminClients = cu.data || [];
            } catch (err) {
                profList.innerHTML = '<span style="color:#ef4444;">Could not load: ' + esc(err.message) + '</span>';
                return;
            }
            renderUsers();
            loadClientAdmin();
            if (!document.getElementById('adminPage').classList.contains('hidden')) document.getElementById('adminTabs').innerHTML = ADMIN_TABS.map(([k, l]) => `<button type="button" class="tab-btn shrink-0 ${adminTab === k ? 'active' : ''}" onclick="setAdminTab('${k}')">${l}${adminTabBadge(k)}</button>`).join('');
        }

        // ---------- everyone in one list: technicians, admins and clients ----------
        const USER_FILTERS = [['all', 'All'], ['technician', 'Technicians'], ['admin', 'Admins'], ['client', 'Clients'], ['pending', 'Waiting for approval']];
        let userFilter = 'all';
        const clientEmailSet = () => new Set(adminClients.map(c => String(c.email || '').toLowerCase()));
        function teamPeople() {
            const byEmail = new Map();
            const get = e => { const k = String(e || '').toLowerCase(); if (!byEmail.has(k)) byEmail.set(k, { email: k }); return byEmail.get(k); };
            adminProfiles.forEach(u => { if (u.email) get(u.email).profile = u; });
            adminAllowed.forEach(a => { if (a.email) get(a.email).allowed = a; });
            adminClients.forEach(c => { if (c.email) get(c.email).client = c; });
            return Array.from(byEmail.values()).map(x => {
                const p = x.profile, a = x.allowed;
                const staff = p ? !!p.approved : !!a;
                const admin = staff && (p ? p.role === 'admin' : a.role === 'admin');
                return Object.assign(x, {
                    name: (p && p.full_name) || (x.client && x.client.full_name) || x.email,
                    staff, admin, technician: staff, clientOn: !!x.client,
                    pending: !!p && !p.approved && !x.client,
                    invited: !p && !!a,
                    me: !!(p && currentUser && p.id === currentUser.id)
                });
            }).sort((a, b) => (b.pending - a.pending) || a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
        }
        function setUserFilter(f) { userFilter = f; renderUsers(); }
        function renderUsers() {
            const people = teamPeople();
            const is = { all: () => true, technician: x => x.staff && !x.admin, admin: x => x.admin, client: x => x.clientOn, pending: x => x.pending };
            document.getElementById('userFilterChips').innerHTML = USER_FILTERS.map(([k, l]) => { const n = people.filter(is[k]).length; return `<button type="button" class="tab-btn ${userFilter === k ? 'active' : ''}" aria-pressed="${userFilter === k}" onclick="setUserFilter('${k}')">${l} ${n}</button>`; }).join('');
            const list = people.filter(is[userFilter] || is.all);

        // turn one role on or off for a person (Technician = staff access; Admin = staff + admin; Client = Client Portal login)

            const x = teamPeople().find(p => p.email === email);
            if (!x) return;
            const p = x.profile;
            const jobs = [];   // the database changes, sent in the background
            if (kind === 'client') {
                if (x.clientOn) {
                    adminClients = adminClients.filter(c => c.email !== email);

                }
            } else {

                else { approved = true; role = x.admin ? 'technician' : 'admin'; }

        // ---------- Exports ----------
        // ---------- Excel (.xlsx) downloads: a small built-in writer, no extra library ----------
        const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
        const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

        function zipStored(files) {

                const h = new DataView(new ArrayBuffer(30));

                h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
                parts.push(new Uint8Array(h.buffer), name, data);
                const c = new DataView(new ArrayBuffer(46));
                c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true); c.setUint16(12, time, true); c.setUint16(14, date, true);
                c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true); c.setUint32(42, offset, true);
                central.push(new Uint8Array(c.buffer), name);

        }
        // one sheet: a bold orange header row (kept in view when scrolling), then the rows; numbers stay numbers
        function xlsxBlob(sheetName, header, rows, widths) {
            const x = v => String(v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
            const colName = i => { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
            const cell = (v, r, c, st) => {
                if (v == null || v === '') return '';
                const ref = colName(c) + r, s = st ? ` s="${st}"` : '';
                if (typeof v === 'number' && isFinite(v)) return `<c r="${ref}"${s}><v>${v}</v></c>`;
                return `<c r="${ref}" t="inlineStr"${s}><is><t xml:space="preserve">${x(v)}</t></is></c>`;
            };
            const all = [header].concat(rows);
            const data = all.map((r, i) => `<row r="${i + 1}">${r.map((v, c) => cell(v, i + 1, c, i === 0 ? 1 : 0)).join('')}</row>`).join('');
            const cols = header.map((h, i) => `<col min="${i + 1}" max="${i + 1}" width="${Math.max(10, Math.min(80, Math.round((widths && widths[i]) || Math.max(12, String(h).length + 4))))}" customWidth="1"/>`).join('');
            const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main', RNS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
            const PKG = 'http://schemas.openxmlformats.org/package/2006/relationships';
            const name = x(String(sheetName || 'Sheet1').replace(/[\[\]:*?\/\\]/g, ' ').slice(0, 31) || 'Sheet1');
            const head = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
            return zipStored([
                { name: '[Content_Types].xml', data: `${head}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>` },
                { name: '_rels/.rels', data: `${head}<Relationships xmlns="${PKG}"><Relationship Id="rId1" Type="${RNS}/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
                { name: 'xl/workbook.xml', data: `${head}<workbook xmlns="${NS}" xmlns:r="${RNS}"><sheets><sheet name="${name}" sheetId="1" r:id="rId1"/></sheets></workbook>` },
                { name: 'xl/_rels/workbook.xml.rels', data: `${head}<Relationships xmlns="${PKG}"><Relationship Id="rId1" Type="${RNS}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${RNS}/styles" Target="styles.xml"/></Relationships>` },
                { name: 'xl/styles.xml', data: `${head}<styleSheet xmlns="${NS}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEA580C"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>` },
                { name: 'xl/worksheets/sheet1.xml', data: `${head}<worksheet xmlns="${NS}"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${cols}</cols><sheetData>${data}</sheetData></worksheet>` }
            ]);
        }

        function xlsxDownload(name, header, rows) {
            const widths = header.map((h, i) => Math.min(60, Math.max(String(h).length + 2, ...rows.slice(0, 300).map(r => String(r[i] == null ? '' : r[i]).length + 2))));
            const blob = xlsxBlob(name, header, rows, widths);
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = `${name} - ${toDayStr(new Date())}.xlsx`;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        }

        async function addOption(kind) {
            if (!isAdmin()) { alert('Only admins can add to this list.'); return; }
            const input = document.getElementById(OPTION_INPUT[kind]);
            const label = input.value.trim();
            if (!label) return;
            const none = kind === 'prep' ? NONE_PREP : kind === 'species' ? NONE_SPECIES : '';
            if ((none && label.toLowerCase() === none.toLowerCase()) || appOptions.some(o => o.kind === kind && o.label.toLowerCase() === label.toLowerCase())) {
                alert('"' + label + '" is already in the list.');
                return;
            }
            const maxSort = Math.max(0, ...appOptions.filter(o => o.kind === kind).map(o => o.sort || 0));
            const row = { id: uid(), kind: kind, label: label, sort: maxSort + 1 };
            if (kind === 'prep') {
                row.unit = document.getElementById('newPrepUnit').value || 'each';
                // every new preparation needs its safety data sheet and the date it expires
                const fileIn = document.getElementById('newPrepSds'), expIn = document.getElementById('newPrepSdsExpiry');
                const file = fileIn.files && fileIn.files[0];
                if (!file) { alert('Add the safety data sheet (SDS) for "' + label + '" - a new preparation needs one.'); fileIn.focus(); return; }
                if (!expIn.value) { alert('Add the date the SDS expires or is due for review.'); expIn.focus(); return; }
                if (!isOnline) { alert('Adding a preparation uploads its SDS, so it needs a connection. Try again when you have signal.'); return; }
                const btn = document.getElementById('addPrepBtn');
                if (btn) { btn.disabled = true; btn.textContent = 'Uploading SDS...'; }
                try { Object.assign(row, await uploadPrepSds(row, file), { sds_expires: expIn.value }); }
                catch (e) { alert('The SDS could not be uploaded: ' + ((e && e.message) || e) + '\n\nThe preparation was not added.'); return; }
                finally { if (btn) { btn.disabled = false; btn.textContent = 'Add preparation'; } }
                fileIn.value = ''; expIn.value = '';
            }
            if (kind === 'species') {
                const cat = pestCatValue('newSpeciesCat', 'newSpeciesCatNew');
                row.category = cat || pestCategoryGuess(label);
                document.getElementById('newSpeciesCatNew').value = '';
            }
            appOptions.push(row);
            input.value = '';
            await cacheSet('app_options', appOptions);
            // First custom station type: also save the standard ones, so the list doesn't shrink to just this one
            if (kind === 'station_type' && !appOptions.some(o => o.kind === 'station_type' && o.id !== row.id && !String(o.id).startsWith('default-'))) {
                for (const [i, l] of DEFAULT_OPTIONS.station_type.entries()) {
                    if (l.toLowerCase() === label.toLowerCase() || appOptions.some(o => o.kind === 'station_type' && o.label === l)) continue;
                    const d = { id: uid(), kind: 'station_type', label: l, sort: i };
                    appOptions.push(d);
                    await enqueue({ kind: 'add_option', siteName: 'Settings', label: `Added station type "${l}"`, data: d });
                }
                row.sort = DEFAULT_OPTIONS.station_type.length + 1;
                await cacheSet('app_options', appOptions);
            }
            await enqueue({ kind: 'add_option', siteName: 'Settings', label: `Added ${OPTION_KIND_LABEL[kind]} "${label}"`, data: row });
            populateOptionSelects();
            renderSettingsLists();
        }
        // ---------- preparation safety data sheets (SDS) ----------
        // saved in the documents storage under library/sds/, so every site's SDS folder and the Client Portal can show them
        async function uploadPrepSds(o, file) {
            const safe = String(file.name || 'sds').replace(/[^\w.\-]+/g, '_').slice(-80);
            const path = `library/sds/${o.id}-${Date.now()}-${safe}`;
            const { error } = await withTimeout(_supabase.storage.from(DOC_BUCKET).upload(path, file, { upsert: true, contentType: file.type || undefined }), 120000, 'SDS upload');
            if (error) throw error;
            return { sds_path: path, sds_name: file.name || safe, sds_updated_at: new Date().toISOString(), sds_updated_by: technicianLabel() };
        }

            sel.value = current || '';
        }
        function pestCatNewToggle(sel, newId) {
            const n = document.getElementById(newId);
            n.classList.toggle('hidden', sel.value !== '__new');
            if (sel.value === '__new') n.focus();
        }
        function pestCatValue(selId, newId) {
            const v = document.getElementById(selId).value;
            return v === '__new' ? document.getElementById(newId).value.trim().replace(/\s+/g, ' ') : v;
        }
        function renderSpeciesAdmin() {
            const el = document.getElementById('speciesOptionsList');
            if (!el) return;
            const admin = isAdmin(), items = speciesItems();
            const warn = optionsLoadError ? `<div class="row-item p-3" style="color:#ef4444;">${esc(optionsLoadError)}</div>` : '';
            const pending = id => queueItems.some(i => i.status !== 'sent' && i.kind === 'add_option' && i.data.id === id);
            el.innerHTML = warn + (pestCategories(items).map(c => `<div class="space-y-1.5"><div class="text-[11px] font-black uppercase tracking-wider t-muted pt-1">${PEST_CAT_ICON[c] || '🐞'} ${esc(c)}</div>` +
                items.filter(o => pestCategoryOf(o) === c).map(o => `
                    <div class="row-item p-3 flex justify-between items-center gap-2">
                        <button type="button" class="min-w-0 text-left t-strong font-semibold break-words" data-id="${esc(o.id)}" onclick="showPestInfo(this.dataset.id)">${esc(o.label)}${pending(o.id) ? ' <span class="t-faint font-normal">(waiting to upload)</span>' : ''}
                            <span class="block text-[10px] font-normal t-faint">${o.photo_path ? '📷 picture' : 'no picture'} · ${o.about || o.breeding || o.control ? 'guide written' : 'no guide yet'}</span></button>
                        ${admin ? `<div class="flex items-center gap-2 shrink-0"><button type="button" data-id="${esc(o.id)}" onclick="editPestInfo(this.dataset.id)" class="link-btn !no-underline font-bold">✎ Guide</button>
                            <button type="button" data-id="${esc(o.id)}" onclick="removeOption(this.dataset.id)" class="font-bold cursor-pointer" style="color:#ef4444;">Remove</button></div>` : ''}
                    </div>`).join('') + '</div>').join('') || '<div class="row-item p-3 t-faint italic">Nothing added yet.</div>');
        }
        let pestEditId = null, pestEditFile = null, pestEditDropPic = false;
        async function editPestInfo(id) {
            const o = findPest(id);
            if (!o) return;
            if (!isAdmin()) { showPestInfo(id); return; }
            pestEditId = o.id; pestEditFile = null; pestEditDropPic = false;
            document.getElementById('pestEditTitle').textContent = o.label;
            fillPestCatSelect('pestEditCat', pestCategoryOf(o));
            document.getElementById('pestEditCatNew').classList.add('hidden');
            document.getElementById('pestEditCatNew').value = '';
            document.getElementById('pestEditAbout').value = o.about || '';
            document.getElementById('pestEditBreeding').value = o.breeding || '';
            document.getElementById('pestEditControl').value = o.control || '';
            document.getElementById('pestEditPhoto').value = '';
            const pic = document.getElementById('pestEditPic');
            pic.innerHTML = o.photo_path ? '<span class="t-faint text-xs">Loading picture...</span>' : '<span class="t-faint text-xs">No picture yet</span>';
            document.getElementById('pestEditPicRemove').classList.toggle('hidden', !o.photo_path);
            document.getElementById('pestEditModal').classList.remove('hidden');
            if (o.photo_path && isOnline) {
                const u = (await getSignedUrls([o.photo_path])).get(o.photo_path);
                if (pestEditId === o.id && !pestEditFile) pic.innerHTML = u ? `<img src="${u}" alt="">` : '<span class="t-faint text-xs">Picture unavailable</span>';
            }
        }
        function closePestEdit() { document.getElementById('pestEditModal').classList.add('hidden'); pestEditId = null; pestEditFile = null; }
        function pestEditPreview(input) {
            const f = input.files && input.files[0];
            if (!f) return;
            pestEditFile = f; pestEditDropPic = false;
            document.getElementById('pestEditPic').innerHTML = `<img src="${URL.createObjectURL(f)}" alt="">`;
            document.getElementById('pestEditPicRemove').classList.remove('hidden');
        }
        function pestEditRemovePic() {
            pestEditFile = null; pestEditDropPic = true;
            document.getElementById('pestEditPhoto').value = '';
            document.getElementById('pestEditPic').innerHTML = '<span class="t-faint text-xs">No picture</span>';
            document.getElementById('pestEditPicRemove').classList.add('hidden');
        }
        async function savePestEdit() {
            const o = findPest(pestEditId);
            if (!o) { closePestEdit(); return; }
            const cat = pestCatValue('pestEditCat', 'pestEditCatNew');
            if (!cat) { alert('Enter the new category name.'); return; }
            const upd = {
                category: cat,
                about: document.getElementById('pestEditAbout').value.trim(),
                breeding: document.getElementById('pestEditBreeding').value.trim(),
                control: document.getElementById('pestEditControl').value.trim(),
                updated_at: new Date().toISOString(), updated_by: technicianLabel()
            };
            const btn = document.getElementById('pestEditSave');
            const old = o.photo_path;
            if (pestEditFile) {
                if (!isOnline) { alert('Uploading a picture needs a connection. Remove the new picture to save the text now.'); return; }
                btn.disabled = true; btn.textContent = 'Uploading picture...';
                try {
                    const blob = await compressImage(pestEditFile, 1600, 0.82, 'avatar');
                    const path = `library/pests/${o.id}-${Date.now()}.jpg`;
                    const { error } = await withTimeout(_supabase.storage.from(PHOTO_BUCKET).upload(path, blob, { upsert: true, contentType: blob.type || 'image/jpeg' }), 120000, 'Picture upload');
                    if (error) throw error;
                    upd.photo_path = path;
                } catch (e) { alert('The picture could not be uploaded: ' + ((e && e.message) || e)); return; }
                finally { btn.disabled = false; btn.textContent = 'Save'; }
            } else if (pestEditDropPic) upd.photo_path = null;
            if (old && upd.photo_path !== undefined && upd.photo_path !== old) _supabase.storage.from(PHOTO_BUCKET).remove([old]).catch(() => {});
            Object.assign(o, upd);
            await cacheSet('app_options', appOptions);
            await enqueue({ kind: 'add_option', siteName: 'Settings', label: `Pest guide for "${o.label}" updated`, data: Object.assign({ id: o.id, kind: 'species', label: o.label, sort: o.sort || 0 }, upd) });
            closePestEdit();
            populateOptionSelects();
            renderSettingsLists();
        }

        async function removeOption(id) {
            if (!isAdmin()) { alert('Only admins can remove items from this list.'); return; }
            const o = appOptions.find(x => x.id === id);
            if (!o) return;
            if (!confirm(`Remove "${o.label}" from the list? Records that already use it are not changed.`)) return;
            appOptions = appOptions.filter(x => x.id !== id);
            await cacheSet('app_options', appOptions);

            // If it was only added on this device and hasn't uploaded, just cancel that
            const unsentAdd = queueItems.find(i => i.status !== 'sent' && i.status !== 'uploading' && i.kind === 'add_option' && i.data.id === id);
            if (unsentAdd) await removeQueueItem(unsentAdd);
            else if (!String(id).startsWith('default-')) {
                await enqueue({ kind: 'delete_option', siteName: 'Settings', label: `Removed ${OPTION_KIND_LABEL[o.kind] || o.kind} "${o.label}"`, data: { id: id, kind: o.kind } });
            }
            updateSyncBadge();
            populateOptionSelects();
            renderSettingsLists();
        }

        // ---------- this file's own page check ----------
        (function () {
            const need = ["adminPage", "adminTabs", "adminTiles", "adminAttention", "adminWorkload", "adminDocsList", "adminDocSite", "adminActivityList", "adminExports", "adminSitesNoClient", "staffProfileModal", "userFilterChips", "adminServicesList", "adminSvcSearch", "adminDocFolder", "adminClientsList", "clientNewSites", "teamSettingsBox", "optionsAdminNote", "newPrepSds", "newPrepSdsExpiry", "newSpeciesCat", "sdsEditModal", "pestEditModal", "newPrepUnit", "adminPanel", "adminNewEmail", "adminNewRole", "adminProfilesList", "adminAllowedList"];
            const missing = need.filter(id => !document.getElementById(id));
            if (missing.length) console.error('admin.html is incomplete. Missing:', missing);
            document.querySelectorAll('.addon-version').forEach(el => { el.textContent = window.ADDON_INFO.version; });
        })();
</script>
</body>
